[project]
name = "vendor-discovery-shortcut"
version = "0.1.0"
description = "Agentic sourcing workflow: goal -> supply chain -> vendors -> evidence -> outreach -> recommendation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-tasks>=2.16.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TRY", "LOG"]
ignore = [
    # `Depends(...)` and `Header(...)` in defaults is how FastAPI declares
    # dependencies. Flagging it would mean writing the framework wrong.
    "B008",
    # Broad excepts are deliberate at the two boundaries that must not crash a
    # mission: the orchestrator's retry path and provider fan-out. Each carries
    # a comment saying why.
    "BLE001",
    # Long messages inside raise() read better than a hoisted variable.
    "TRY003",
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
# Tests name things for readability, not for a linter.
"tests/*" = ["E501", "RUF012"]
